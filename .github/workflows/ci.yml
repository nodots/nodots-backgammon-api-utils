name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Without this, the first version to fail cancels the other, and the
      # cancelled job reports as a failure even when its own steps passed.
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `lint` is still absent from this workflow: the script has no eslint
      # config to run against and errors out on the flat-config migration
      # notice. Tests cover src/position.ts, which is what the public client
      # renders boards through.
      - name: Run tests
        run: npm test
